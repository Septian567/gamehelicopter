    <style>

    <script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=960,H=540,G=H-36;
const R=(a,b)=>a+Math.random()*(b-a),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let st='menu',P,E,B,PB,PM,RK,CL,PU,puT,SQ,paused=false,EB,BM,FX,prog,bd,boss,score,tm,spawnT,shake,flash,portal,banner,bt,scroll=0,keys={},tt=null,tfire=false;
function reset(){P={x:120,y:270,hp:100,en:100,inv:false,sh:0,bm:0,rk:0,cl:0,sq:0,cx:0,iv:0,ic:0,tp:0,ban:0,nuke:0,hit:0};E=[];B=[];PB=[];PM=[];RK=[];CL=[];PU=[];puT=8;SQ=[];paused=false;EB=[];BM=[];FX=[];prog=0;bd=[0,0,0];boss=null;score=0;tm=0;spawnT=1;shake=0;flash=0;portal=0;banner='';bt=0;}
reset();
function boom(x,y,col,n=18,sp=220){for(let i=0;i<n;i++){const a=R(0,6.28),s=R(30,sp);FX.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.3,.9),m:.9,c:col,r:R(2,5)})}}
function ring(x,y,col,max=60){FX.push({ring:1,x,y,r:5,max,l:.6,m:.6,c:col})}
function hurt(n){if(P.inv||P.hit>0||st!='play')return;P.hp-=n;P.hit=.8;shake=.3;boom(P.x,P.y,'#ff4d6d',12);if(P.hp<=0){P.hp=0;st='over';boom(P.x,P.y,'#ffb703',50,400)}}
function shootE(e,ang,sp){EB.push({x:e.x-20,y:e.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp})}
function aim(e){return Math.atan2(P.y-e.y,P.x-e.x)}
function bomb(e,vx){BM.push({x:e.x,y:e.y+10,vx:vx,vy:0})}
function spawn(){if(Math.random()<.55)E.push({k:'h',x:W+40,y:0,by:R(60,320),vx:-R(60,110),hp:3,t:R(0,6),s:0});else E.push({k:'j',x:W+40,y:R(50,400),vx:-R(220,300),hp:2,t:0,s:0,b:0})}
function spawnBoss(n){boss={n,x:W+120,y:270,hp:[70,140,230][n-1],max:[70,140,230][n-1],t:0,s:0,b:0,u:0,r:[58,78,95][n-1]};banner='⚠ BOS '+n+(n>1?' + PERANG!':'');bt=2.5}
function act(a){if(st!='play'||paused)return;
if(a=='inv'){if(P.inv){P.inv=false;P.ic=5}else if(P.ic<=0){P.inv=true;P.iv=30}}
if(a=='bomb'&&!P.inv&&P.bm<=0){P.bm=1.2;PM.push({x:P.x,y:P.y+14,vx:160,vy:0})}
if(a=='rocket'&&!P.inv&&P.rk<=0){P.rk=3;RK.push({x:P.x+25,y:P.y,vx:300,vy:0,t:0})}
if(a=='clone'&&P.cl<=0){P.cl=120;for(let i=0;i<3;i++)CL.push({x:P.x,y:P.y,ox:-50-i*10,oy:(i-1)*55,t:30,s:R(0,.3)});ring(P.x,P.y,'#7dff9a',70);boom(P.x,P.y,'#7dff9a',20)}
if(a=='squad'&&P.sq<=0){P.sq=60;for(let i=0;i<10;i++)SQ.push({x:-40-i*20,tx:50+(i%3)*38,ty:50+i*((G-100)/9),t:40,s:R(0,.5),ph:i,hp:4,fl:0});banner='Pasukan tiba!';bt=1.5}
if(a=='clear'&&P.cx<=0){P.cx=60;score+=EB.length*2+BM.length*5;for(const q of EB)boom(q.x,q.y,'#7dffea',3,80);for(const q of BM)boom(q.x,q.y,'#7dffea',6,100);EB=[];BM=[];ring(P.x,P.y,'#7dffea',900);flash=Math.max(flash,.25)}
if(a=='tp'&&P.tp<=0){ring(P.x,P.y,'#4df',50);boom(P.x,P.y,'#4df',16);P.x=R(80,W-320);P.y=R(60,G-40);P.tp=4;P.hit=Math.max(P.hit,.6);ring(P.x,P.y,'#4df',50);boom(P.x,P.y,'#4df',16)}
if(a=='dim'&&P.ban<=0){P.ban=60;portal=1.2;for(const e of E){score+=10;ring(e.x,e.y,'#b36bff',50);boom(e.x,e.y,'#b36bff',10)}E=[];EB=[];BM=[];if(boss){boss.hp-=3;banner='Bos kebal dimensi!';bt=1.5}}
if(a=='nuke'&&P.nuke<=0){P.nuke=60;flash=1.5;shake=1;for(const e of E){score+=10;boom(e.x,e.y,'#ffd166',14)}E=[];EB=[];BM=[];if(boss)boss.hp-=boss.max*.4}}
function key(e,v){const c=e.code;keys[c]=v;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(c))e.preventDefault();
if(v){if(c=='KeyP'||c=='Escape'){togglePause();return}if(c=='KeyM'){toggleMute();return}if(paused&&(c=='Enter'||c=='Space')){togglePause();return}if(st!='play'&&(c=='Enter'||c=='Space')){reset();st='play';return}
if(c=='KeyI')act('inv');if(c=='KeyB')act('bomb');if(c=='KeyR')act('rocket');if(c=='KeyC')act('clone');if(c=='KeyF')act('squad');if(c=='KeyX')act('clear');if(c=='KeyT')act('tp');if(c=='KeyQ')act('dim');if(c=='KeyN')act('nuke')}}
addEventListener('keydown',e=>key(e,1));addEventListener('keyup',e=>key(e,0));
const bind=(id,a)=>document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();if(st!='play'){reset();st='play'}else act(a)});
bind('bI','inv');bind('bT','tp');bind('bQ','dim');bind('bN','nuke');bind('bB','bomb');bind('bR','rocket');bind('bC','clone');bind('bP','squad');bind('bX','clear');
const bF=document.getElementById('bF');bF.addEventListener('pointerdown',e=>{e.preventDefault();if(st!='play'){reset();st='play'}tfire=true});['pointerup','pointerleave','pointercancel'].forEach(n=>bF.addEventListener(n,()=>tfire=false));
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{if(paused){togglePause();return}if(st!='play'){reset();st='play';return}tt=pt(e)});cv.addEventListener('pointermove',e=>{if(tt)tt=pt(e)});['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>tt=null));

let AC,mg,mus=true,stp=0,nxt=0;
const BS=[55,55,65.4,49,55,55,73.4,65.4],LD=[440,0,523,0,659,523,0,587,440,0,523,0,784,659,587,523];
function note(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.2)}
function sched(){if(!AC||AC.state!='running')return;const sp=boss?0.13:0.17;if(nxt<AC.currentTime)nxt=AC.currentTime;while(nxt<AC.currentTime+.25){const on=st=='play'||st=='menu',i=stp%16;if(on){if(i%2==0)note(BS[(stp>>1)%8]*(boss?1.12:1),nxt,sp*1.8,'sawtooth',.35);if(i%4==0)kick(nxt);if(LD[i])note(LD[i]*(boss&&i%2?1.26:1),nxt,sp*1.4,'square',.1);if(boss&&i%4==2)note(1200,nxt,.04,'square',.05)}stp++;nxt+=sp}}
function initAudio(){if(AC){if(AC.state=='suspended'&&!paused)AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=mus?.2:0;mg.connect(AC.destination);nxt=AC.currentTime+.1;setInterval(sched,80)}catch(e){}}
function togglePause(){if(st!='play')return;paused=!paused;if(AC){paused?AC.suspend():AC.resume()}document.getElementById('bPa').textContent=lb(paused?'▶ Lanjut [P]':'⏸️ Pause [P]')}
function toggleMute(){mus=!mus;if(mg)mg.gain.value=mus?.2:0;document.getElementById('bM').textContent=lb(mus?'🔊 Musik [M]':'🔇 Musik [M]')}
addEventListener('pointerdown',initAudio);addEventListener('keydown',initAudio);
const touch=matchMedia('(pointer:coarse)').matches,lb=s=>touch?s.replace(/ \[.\]/,''):s,TL=['Sentuh dan tahan layar: helikopter terbang ke arah jari','Tombol di samping layar: tembak, skill, dan pause','Ambil ➕ hijau untuk tambah nyawa','Kalahkan 3 bos lalu capai FINISH!'];let UI=1;
function fit(){const side=innerWidth>innerHeight&&innerHeight<600&&innerWidth>=560;document.body.classList.toggle('side',side);const bl=document.getElementById('bl'),br=document.getElementById('br'),rt=document.getElementById('rot'),cs=getComputedStyle(document.documentElement),pv=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+12;let aw,ah;
if(side){aw=innerWidth-bl.offsetWidth-br.offsetWidth-16-24;ah=innerHeight-pv}
else{aw=innerWidth-16;ah=innerHeight-pv-bl.offsetHeight-br.offsetHeight-(rt?rt.offsetHeight:0)-24}
const w=Math.max(220,Math.min(aw,ah*16/9,1500));cv.style.width=w+'px';cv.style.height=w*9/16+'px';UI=Math.max(1,Math.min(1.9,720/w))}
if(touch)document.querySelectorAll('.btns button').forEach(b=>b.textContent=lb(b.textContent));
fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));if(window.visualViewport)visualViewport.addEventListener('resize',fit);addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st=='play'&&!paused)togglePause()});
document.getElementById('bPa').addEventListener('pointerdown',e=>{e.preventDefault();togglePause()});
document.getElementById('bM').addEventListener('pointerdown',e=>{e.preventDefault();toggleMute()});
function update(dt){tm+=dt;scroll+=(boss?60:140)*dt;
P.hit-=dt;P.sh-=dt;P.bm-=dt;P.rk-=dt;P.cl-=dt;P.sq-=dt;P.cx-=dt;P.ic-=dt;if(P.inv){P.iv-=dt;if(P.iv<=0){P.inv=false;P.ic=5}}P.tp-=dt;P.ban-=dt;P.nuke-=dt;shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);portal=Math.max(0,portal-dt);bt-=dt;
let dx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),dy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
if(tt){const vx=tt.x-P.x,vy=tt.y-P.y,d=Math.hypot(vx,vy);if(d>10){dx=vx/d;dy=vy/d}}
const m=Math.hypot(dx,dy)||1;P.x=Math.max(40,Math.min(W-40,P.x+dx/m*340*dt*(dx||dy?1:0)));P.y=Math.max(40,Math.min(G-25,P.y+dy/m*340*dt*(dx||dy?1:0)));

if((keys.Space||tfire)&&!P.inv&&P.sh<=0){P.sh=.13;PB.push({x:P.x+30,y:P.y+2,vx:720,vy:0})}
// progres & spawn
if(!boss){prog+=dt/150;spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.6,1.6-prog*.9)*R(.7,1.2)}
if(prog>=.25&&!bd[0]){bd[0]=1;spawnBoss(1);E=E.filter(e=>{boom(e.x,e.y,'#b36bff',8);return false})}
else if(prog>=.5&&!bd[1]){bd[1]=1;spawnBoss(2);E=E.filter(e=>{boom(e.x,e.y,'#b36bff',8);return false})}
else if(prog>=.75&&!bd[2]){bd[2]=1;spawnBoss(3);E=E.filter(e=>{boom(e.x,e.y,'#b36bff',8);return false})}
else if(prog>=1&&bd[2]){st='win';flash=1}}
// peluru pemain
for(const b of PB){b.x+=b.vx*dt}PB=PB.filter(b=>b.x<W+20);
// musuh
for(const e of E){e.t+=dt;e.s-=dt;e.x+=e.vx*dt;
if(e.k=='h'){e.y=e.by+Math.sin(e.t*2)*40;if(e.s<=0&&e.x<W-30){e.s=1.7;shootE(e,aim(e),230)}}
else{if(e.s<=0&&e.x<W-30){e.s=.9;shootE(e,Math.PI,330)}e.b-=dt;if(e.b<=0&&e.x<W-60){e.b=1.4;bomb(e,e.vx*.6)}}
for(const b of PB)if(!b.d&&Math.abs(b.x-e.x)<32&&Math.abs(b.y-e.y)<20){b.d=1;e.hp--;boom(b.x,b.y,'#fff',4,100)}
if(e.hp<=0){e.dead=1;score+=e.k=='h'?30:40;boom(e.x,e.y,'#ff9f1c',24,260)}
if(!P.inv&&D(e,P)<34){hurt(15);e.dead=1;boom(e.x,e.y,'#ff9f1c',20)}}
E=E.filter(e=>!e.dead&&e.x>-80);
// bos
if(boss){const b=boss;b.t+=dt;b.s-=dt;b.b-=dt;b.u-=dt;b.x+=(Math.max(b.x-60*dt,b.n==1?770:760)-b.x);
b.y=270+Math.sin(b.t*(b.n==1?.9:b.n==2?1.2:1.5))*(b.n==1?130:b.n==2?120:150);
if(b.x<800){if(b.s<=0){b.s=b.n==1?1.2:b.n==2?.95:.8;const a=aim(b),k=b.n==1?1:b.n==2?2:3;for(let i=-k;i<=k;i++)shootE(b,a+i*.2,250)}
if(b.n>=2){if(b.b<=0){b.b=3;for(let i=0;i<3;i++)BM.push({x:b.x-i*40,y:b.y+20,vx:-120-i*40,vy:-60})}
if(b.u<=0){b.u=6;E.push({k:'j',x:W+40,y:R(60,400),vx:-260,hp:2,t:0,s:0,b:0})}
if(b.n==3){b.r2=(b.r2||0)-dt;if(b.r2<=0){b.r2=3.5;for(let i=0;i<14;i++){const a=i/14*6.283+b.t;EB.push({x:b.x,y:b.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200})}}}}}
for(const p of PB)if(!p.d&&Math.abs(p.x-b.x)<b.r&&Math.abs(p.y-b.y)<b.r*.6){p.d=1;b.hp--;boom(p.x,p.y,'#fff',3,90)}
if(b.n>=2&&b.x<800){b.w=(b.w||0)-dt;if(b.w<=0&&E.length<(b.n==2?10:16)){b.w=b.n==2?1.1:.7;spawn();if(b.n==3&&Math.random()<.4)spawn()}}
if(!P.inv&&D(b,P)<b.r*.8)hurt(20);
if(b.hp<=0){score+=[500,1000,2000][b.n-1];flash=.8;shake=.8;for(let i=0;i<6;i++)boom(b.x+R(-50,50),b.y+R(-30,30),'#ffd166',30,350);boss=null;banner=b.n==3?'Menuju FINISH!':'Bos '+b.n+' kalah!';bt=2}}
PB=PB.filter(b=>!b.d);
for(const b of PM){b.vy+=400*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;let hit=b.y>G;for(const e of E)if(Math.abs(e.x-b.x)<34&&Math.abs(e.y-b.y)<28)hit=true;if(boss&&Math.abs(boss.x-b.x)<boss.r&&Math.abs(boss.y-b.y)<boss.r*.7)hit=true;
if(hit){b.d=1;boom(b.x,b.y,'#ff9f1c',30,300);ring(b.x,b.y,'#ffd166',90);shake=Math.max(shake,.2);for(const e of E)if(Math.hypot(e.x-b.x,e.y-b.y)<95)e.hp-=3;if(boss&&Math.hypot(boss.x-b.x,boss.y-b.y)<95+boss.r)boss.hp-=8;EB=EB.filter(q=>Math.hypot(q.x-b.x,q.y-b.y)>95)}}PM=PM.filter(b=>!b.d&&b.x<W+40);
for(const r of RK){r.t+=dt;let tg=null,bd2=1e9;for(const e of E){const d=D(e,r);if(e.x>r.x-40&&d<bd2){bd2=d;tg=e}}if(boss&&boss.x<W+50){const d=D(boss,r);if(d<bd2||!tg)tg=boss}
if(tg){const a=Math.atan2(tg.y-r.y,tg.x-r.x),c0=Math.atan2(r.vy,r.vx);let df=a-c0;while(df>Math.PI)df-=6.283;while(df<-Math.PI)df+=6.283;const na=c0+Math.max(-4*dt,Math.min(4*dt,df)),sp=Math.min(600,Math.hypot(r.vx,r.vy)+500*dt);r.vx=Math.cos(na)*sp;r.vy=Math.sin(na)*sp}else{r.vx=Math.min(600,r.vx+500*dt)}
r.x+=r.vx*dt;r.y+=r.vy*dt;let hit=r.y>G||r.t>4;for(const e of E)if(Math.abs(e.x-r.x)<34&&Math.abs(e.y-r.y)<26)hit=true;if(boss&&Math.abs(boss.x-r.x)<boss.r&&Math.abs(boss.y-r.y)<boss.r*.7)hit=true;
if(hit){r.d=1;boom(r.x,r.y,'#ff5d2e',34,320);ring(r.x,r.y,'#ffb703',75);shake=Math.max(shake,.25);for(const e of E)if(Math.hypot(e.x-r.x,e.y-r.y)<75)e.hp-=5;if(boss&&Math.hypot(boss.x-r.x,boss.y-r.y)<75+boss.r)boss.hp-=10}}
RK=RK.filter(r=>!r.d&&r.x<W+40&&r.x>-40&&r.y>-40);
for(const c of CL){c.t-=dt;c.x+=(P.x+c.ox-c.x)*Math.min(1,6*dt);c.y+=(Math.max(30,Math.min(G-20,P.y+c.oy))-c.y)*Math.min(1,6*dt);c.s-=dt;if(c.s<=0){c.s=.3;PB.push({x:c.x+30,y:c.y+2,vx:720,vy:0})}}CL=CL.filter(c=>c.t>0);
puT-=dt;if(puT<=0){puT=R(9,15);PU.push({x:W+20,y:R(70,G-60),t:0,yy:0})}
for(const p of PU){p.t+=dt;p.x-=110*dt;p.yy=p.y+Math.sin(p.t*3)*12;if(Math.hypot(p.x-P.x,p.yy-P.y)<32){p.d=1;P.hp=Math.min(100,P.hp+25);ring(P.x,P.y,'#5dff8a',50);boom(P.x,P.y,'#5dff8a',14)}}PU=PU.filter(p=>!p.d&&p.x>-30);
for(const s of SQ){s.t-=dt;s.x+=(s.tx-s.x)*Math.min(1,2.5*dt);s.y=s.ty+Math.sin(tm*2+s.ph)*10;s.s-=dt;if(s.s<=0&&s.x>0){s.s=.55;PB.push({x:s.x+28,y:s.y,vx:650,vy:0})}}for(const s of SQ){if(s.x<0)continue;for(const b of EB)if(!b.d&&Math.hypot(b.x-s.x,b.y-s.y)<20){b.d=1;s.hp--;s.fl=.15;boom(b.x,b.y,'#ffd166',5,100)}for(const b of BM)if(!b.d&&Math.hypot(b.x-s.x,b.y-s.y)<28){b.d=1;s.hp-=2;s.fl=.15;boom(b.x,b.y,'#ff7b00',16,220)}s.fl-=dt;if(s.hp<=0){s.t=0;boom(s.x,s.y,'#ffd166',24,260);ring(s.x,s.y,'#ffb703',45)}}

function heli(x,y,s,col,fl,t){ctx.save();ctx.translate(x,y);ctx.scale(fl*s,s);ctx.shadowColor=col;ctx.shadowBlur=14;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,26,12,0,0,7);ctx.fill();ctx.fillRect(-54,-3,30,5);ctx.fillRect(-56,-13,5,15);const rw=44*Math.abs(Math.cos(t*25))+6;ctx.fillStyle='#fff';ctx.fillRect(-rw,-18,rw*2,2.5);ctx.fillRect(-2,-18,4,7);ctx.fillStyle='#bff';ctx.beginPath();ctx.ellipse(11,-3,11,6,0,0,7);ctx.fill();ctx.fillStyle=col;ctx.fillRect(-18,15,42,2.5);ctx.fillRect(-8,11,3,5);ctx.fillRect(12,11,3,5);ctx.restore()}
function jet(x,y,s,col,fl){ctx.save();ctx.translate(x,y);ctx.scale(fl*s,s);ctx.shadowColor=col;ctx.shadowBlur=14;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(34,0);ctx.lineTo(8,-5);ctx.lineTo(-14,-24);ctx.lineTo(-22,-24);ctx.lineTo(-12,-4);ctx.lineTo(-30,-14);ctx.lineTo(-34,-14);ctx.lineTo(-28,0);ctx.lineTo(-34,14);ctx.lineTo(-30,14);ctx.lineTo(-12,4);ctx.lineTo(-22,24);ctx.lineTo(-14,24);ctx.lineTo(8,5);ctx.closePath();ctx.fill();ctx.fillStyle='#bff';ctx.beginPath();ctx.ellipse(8,0,8,3,0,0,7);ctx.fill();ctx.restore()}

for(let i=0;i<50;i++){const x=((i*173-scroll*.05)%W+W)%W,y=(i*97)%300;ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(x,y,1.5,1.5)}
ctx.fillStyle=`hsl(${hue+90},100%,70%)`;ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=40;ctx.beginPath();ctx.arc(740,170,50,0,7);ctx.fill();ctx.shadowBlur=0;
[[.2,150,.25],[.5,90,.5],[1,50,.8]].forEach(([sp,h,a],k)=>{ctx.fillStyle=`hsla(${hue+20*k},60%,${14-k*3}%,${.5+a/2})`;ctx.beginPath();ctx.moveTo(0,G);for(let x=0;x<=W;x+=10){const u=x+scroll*sp;ctx.lineTo(x,G-h*(.5+.25*Math.sin(u*.008+k)+.25*Math.sin(u*.021+k*2)))}ctx.lineTo(W,G);ctx.fill()});
for(let i=0;i<5;i++){const x=((i*260-scroll*.3)%1300+1300)%1300-150;ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.ellipse(x,70+i*45,80,16,0,0,7);ctx.fill()}
ctx.fillStyle='#0a0620';ctx.fillRect(0,G,W,H-G);ctx.strokeStyle=`hsl(${hue+90},100%,60%)`;ctx.lineWidth=1.5;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(0,G);ctx.lineTo(W,G);for(let i=0;i<20;i++){const x=((i*60-scroll)%1200+1200)%1200-120;ctx.moveTo(x+60,G);ctx.lineTo(x-60,H)}ctx.stroke();ctx.shadowBlur=0}
function bar(x,y,w,v,col,lab){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x,y,w,10);ctx.fillStyle=col;ctx.fillRect(x,y,w*Math.max(0,v),10);ctx.strokeStyle='#fff6';ctx.strokeRect(x,y,w,10);ctx.fillStyle='#fff';ctx.font=Math.round(10*Math.min(UI,1.6))+'px system-ui';ctx.textAlign='left';ctx.fillText(lab,x+3,y-3)}

ctx.fillStyle='#ffd166';ctx.shadowColor='#ff9f1c';ctx.shadowBlur=10;for(const b of PM){ctx.beginPath();ctx.ellipse(b.x,b.y,7,10,.5,0,7);ctx.fill()}ctx.shadowBlur=0;

if(flash>0){ctx.fillStyle=`rgba(255,255,255,${Math.min(1,flash)})`;ctx.fillRect(0,0,W,H);if(flash>.8){ctx.strokeStyle='#ffd166';ctx.lineWidth=8;ctx.beginPath();ctx.arc(P.x,P.y,(1.5-flash)*1000,0,7);ctx.stroke()}}
// HUD
bar(14,22,170,P.hp/100,'#ff4d6d','NYAWA');bar(14,48,170,P.inv?P.iv/30:1-Math.max(0,P.ic)/5,'#4df',P.inv?'INVISIBEL '+Math.ceil(P.iv)+'d':(P.ic>0?'INVISIBEL ISI ULANG '+Math.ceil(P.ic)+'d':'INVISIBEL SIAP'));
txt('SKOR '+score,W-14,28,18,'#ffe66d','right');
const px=W/2-150;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(px,16,300,10);ctx.fillStyle='#2de2e6';ctx.fillRect(px,16,300*Math.min(1,prog),10);[.25,.5,.75].forEach(v=>{ctx.fillStyle='#ff4d6d';ctx.fillRect(px+300*v-2,12,4,18)});ctx.fillStyle='#fff';ctx.fillRect(px+296,12,4,18);ctx.strokeStyle='#fff6';ctx.strokeRect(px,16,300,10);
if(boss)bar(W/2-150,40,300,boss.hp/boss.max,'#ff9f1c','BOS '+boss.n);
const sk=[['Q','Dimensi',P.ban,60,'#b36bff'],['T','Teleport',P.tp,4,'#4df'],['B','Bom',P.bm,1.2,'#ff9f1c'],['R','Roket',P.rk,3,'#ff5d2e'],['C','Kloning',P.cl,120,'#7dff9a'],['F','Pasukan',P.sq,60,'#ffd166'],['X','Bersih',P.cx,60,'#7dffea'],['N','Nuklir',P.nuke,60,'#ffd166']];sk.forEach((s,i)=>{const x=14+i*92,y=H-30,rd=s[2]<=0;ctx.fillStyle=rd?s[4]:'#222';ctx.globalAlpha=rd?.9:.7;ctx.fillRect(x,y-4,84,24);ctx.globalAlpha=1;ctx.fillStyle=rd?'#000':'#fff';ctx.font='700 '+Math.round(12*Math.min(UI,1.25))+'px system-ui';ctx.textAlign='center';ctx.fillText(rd?`[${s[0]}] ${s[1]}`:`${s[1]} ${Math.ceil(s[2])}d`,x+42,y+12,78)});

let last=performance.now();function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(st=='play'){if(!paused)update(dt)}else{tm+=dt;scroll+=60*dt;for(const f of FX){f.l-=dt;if(f.ring)f.r+=(f.max/f.m)*dt;else{f.x+=f.vx*dt;f.y+=f.vy*dt}}FX=FX.filter(f=>f.l>0);flash=Math.max(0,flash-dt)}draw();requestAnimationFrame(loop)}
